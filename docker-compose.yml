name: s3fh

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Lets S3 clients use virtual-host addressing (bucket.minio), which the
      # AWS Java SDK v2 inside RIOT-X defaults to
      MINIO_DOMAIN: minio
    ports:
      - "9002:9000"
      - "9003:9001"

  redis:
    image: redis:8.2
    ports:
      - "6398:6379"
