<svg viewBox="0 0 1800 1170" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#FF4438"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2D7FF9"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5B6B75"/></marker>
    <marker id="ad" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#091A23"/></marker>
  </defs>

  <rect x="0" y="0" width="1800" height="1170" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="60" y="62" font-size="34" font-weight="bold" fill="#091A23">Feature Store Online com Redis: design proposto</text>
  <text x="60" y="94" font-size="18" fill="#5B6B75">Materializa&#231;&#227;o batch (S3 Parquet) via Glue, serving e c&#225;lculo de features no Redis Cloud, conectividade por AWS PrivateLink (sa-east-1)</text>
  <rect x="1490" y="40" width="250" height="40" rx="6" fill="#FF4438"/>
  <text x="1615" y="66" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Redis</text>

  <!-- ============ LEFT: Itau AWS account ============ -->
  <rect x="40" y="130" width="1030" height="870" rx="14" fill="#FAFBFC" stroke="#C8CFD4" stroke-width="2"/>
  <text x="70" y="168" font-size="22" font-weight="bold" fill="#091A23">Conta AWS do time (Ita&#250;) &#183; sa-east-1</text>

  <!-- VPC -->
  <rect x="66" y="190" width="978" height="784" rx="12" fill="#FFFFFF" stroke="#8AA0AC" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="92" y="222" font-size="17" font-weight="bold" fill="#5B6B75">VPC do time (mesh descentralizado: cada squad na pr&#243;pria conta)</text>

  <!-- ML Platform -->
  <rect x="100" y="248" width="400" height="112" rx="10" fill="#EEF3F6" stroke="#8AA0AC" stroke-width="1.5"/>
  <text x="120" y="282" font-size="19" font-weight="bold" fill="#091A23">Plataforma de ML (Ita&#250;)</text>
  <text x="120" y="310" font-size="15" fill="#3D4F5A">Registro de feature groups, versionamento,</text>
  <text x="120" y="332" font-size="15" fill="#3D4F5A">metadados e contrato (YAML)</text>

  <!-- Online producers (phase 2) -->
  <rect x="560" y="248" width="360" height="90" rx="10" fill="#FFFFFF" stroke="#8AA0AC" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="580" y="280" font-size="17" font-weight="bold" fill="#5B6B75">Produtores de features online</text>
  <text x="580" y="306" font-size="15" fill="#5B6B75">streaming / eventos (fase 2: dual-write)</text>

  <!-- S3 offline store -->
  <rect x="100" y="430" width="400" height="170" rx="10" fill="#EEF3F6" stroke="#8AA0AC" stroke-width="1.5"/>
  <text x="120" y="464" font-size="19" font-weight="bold" fill="#091A23">Amazon S3 &#183; offline store</text>
  <text x="120" y="492" font-size="15" fill="#3D4F5A">Parquet particionado por event time</text>
  <text x="120" y="514" font-size="15" fill="#3D4F5A">(mainframe e batches "esquentam" aqui)</text>
  <text x="120" y="536" font-size="15" fill="#3D4F5A">Hist&#243;rico completo, v&#225;rias vers&#245;es</text>
  <text x="120" y="558" font-size="15" fill="#3D4F5A">por entidade + tombstones (is_deleted)</text>

  <!-- Glue materializer (the glue/cola) -->
  <rect x="560" y="380" width="360" height="360" rx="10" fill="#FFF5F4" stroke="#FF4438" stroke-width="3"/>
  <text x="580" y="414" font-size="19" font-weight="bold" fill="#FF4438">Glue job: feature materializer</text>
  <text x="580" y="438" font-size="15" font-style="italic" fill="#8A5A56">a "cola" padr&#227;o da plataforma</text>
  <text x="580" y="472" font-size="15" fill="#3D4F5A">1. L&#234; o Parquet do offline store</text>
  <text x="580" y="498" font-size="15" fill="#3D4F5A">2. Dedupe: &#250;ltima vers&#227;o por entidade,</text>
  <text x="596" y="520" font-size="15" fill="#3D4F5A">descarta tombstones (snapshot)</text>
  <text x="580" y="546" font-size="15" fill="#3D4F5A">3. Aplica o contrato do feature group</text>
  <text x="580" y="572" font-size="15" fill="#3D4F5A">4. Escreve Hash em pipeline</text>
  <text x="596" y="594" font-size="15" fill="#3D4F5A">(1 conex&#227;o por parti&#231;&#227;o Spark)</text>
  <text x="580" y="620" font-size="15" fill="#3D4F5A">5. Cria o &#237;ndice de busca (FT.CREATE)</text>
  <text x="580" y="646" font-size="15" fill="#3D4F5A">6. Valida: contagem + amostra relida,</text>
  <text x="596" y="668" font-size="15" fill="#3D4F5A">exit code honesto pra orquestra&#231;&#227;o</text>
  <text x="580" y="706" font-size="14" fill="#8A5A56">Idempotente &#183; parametrizado &#183; sem toil</text>

  <!-- SageMaker -->
  <rect x="100" y="700" width="400" height="240" rx="10" fill="#EEF3F6" stroke="#8AA0AC" stroke-width="1.5"/>
  <text x="120" y="734" font-size="19" font-weight="bold" fill="#091A23">Amazon SageMaker</text>
  <rect x="120" y="752" width="360" height="76" rx="8" fill="#FFFFFF" stroke="#B9C6CD" stroke-width="1.5"/>
  <text x="138" y="782" font-size="16" font-weight="bold" fill="#3D4F5A">Treino e batch scoring (offline)</text>
  <text x="138" y="806" font-size="14" fill="#5B6B75">consome o offline store (S3 / Athena)</text>
  <rect x="120" y="840" width="360" height="84" rx="8" fill="#FFFFFF" stroke="#2D7FF9" stroke-width="2"/>
  <text x="138" y="870" font-size="16" font-weight="bold" fill="#0F4FA8">Endpoint de infer&#234;ncia (online)</text>
  <text x="138" y="894" font-size="14" fill="#5B6B75">l&#234; features do Redis no caminho quente</text>
  <text x="138" y="914" font-size="14" fill="#5B6B75">fraude: decis&#227;o em milissegundos</text>

  <!-- VPC interface endpoint -->
  <rect x="946" y="520" width="86" height="150" rx="10" fill="#F3F0FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="989" y="560" font-size="14" font-weight="bold" fill="#4C1D95" text-anchor="middle">VPC</text>
  <text x="989" y="580" font-size="14" font-weight="bold" fill="#4C1D95" text-anchor="middle">Interface</text>
  <text x="989" y="600" font-size="14" font-weight="bold" fill="#4C1D95" text-anchor="middle">Endpoint</text>
  <text x="989" y="628" font-size="13" fill="#6D5BA8" text-anchor="middle">ENI local,</text>
  <text x="989" y="646" font-size="13" fill="#6D5BA8" text-anchor="middle">mesma AZ</text>

  <!-- ============ PrivateLink ============ -->
  <rect x="1044" y="565" width="146" height="60" rx="8" fill="#7C3AED"/>
  <text x="1117" y="590" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AWS PrivateLink</text>
  <text x="1117" y="612" font-size="13" fill="#E4DAFB" text-anchor="middle">tr&#225;fego privado</text>
  <line x1="1032" y1="595" x2="1044" y2="595" stroke="#7C3AED" stroke-width="6"/>
  <line x1="1190" y1="595" x2="1206" y2="595" stroke="#7C3AED" stroke-width="6"/>
  <text x="1117" y="648" font-size="13" fill="#6D5BA8" text-anchor="middle">sem internet, mesma regi&#227;o</text>

  <!-- ============ RIGHT: Redis Cloud ============ -->
  <rect x="1206" y="130" width="554" height="870" rx="14" fill="#091A23"/>
  <text x="1234" y="168" font-size="22" font-weight="bold" fill="#FFFFFF">Redis Cloud (conta dedicada) &#183; AWS sa-east-1</text>
  <rect x="1234" y="186" width="498" height="34" rx="6" fill="#163341"/>
  <text x="1483" y="209" font-size="14" fill="#9FD9CF" text-anchor="middle">Alta disponibilidade multi-AZ &#183; failover autom&#225;tico &#183; SLA contratual</text>

  <!-- Fraud dedicated cluster -->
  <rect x="1234" y="240" width="498" height="380" rx="10" fill="#0E2833" stroke="#2A4A58" stroke-width="1.5"/>
  <text x="1256" y="274" font-size="19" font-weight="bold" fill="#FFFFFF">Cluster dedicado: Fraude</text>
  <text x="1256" y="296" font-size="14" fill="#9FB4BE">blast radius isolado (autoriza&#231;&#227;o em tempo real)</text>
  <rect x="1256" y="312" width="454" height="44" rx="8" fill="#FF4438"/>
  <text x="1483" y="340" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Proxy &#183; multiplexa&#231;&#227;o de conex&#245;es</text>
  <rect x="1256" y="372" width="140" height="90" rx="8" fill="#163341" stroke="#3D6373" stroke-width="1.5"/>
  <text x="1326" y="404" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AZ-a</text>
  <text x="1326" y="428" font-size="13" fill="#9FB4BE" text-anchor="middle">shard master</text>
  <rect x="1413" y="372" width="140" height="90" rx="8" fill="#163341" stroke="#3D6373" stroke-width="1.5"/>
  <text x="1483" y="404" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AZ-b</text>
  <text x="1483" y="428" font-size="13" fill="#9FB4BE" text-anchor="middle">r&#233;plica</text>
  <rect x="1570" y="372" width="140" height="90" rx="8" fill="#163341" stroke="#3D6373" stroke-width="1.5"/>
  <text x="1640" y="404" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AZ-c</text>
  <text x="1640" y="428" font-size="13" fill="#9FB4BE" text-anchor="middle">quorum</text>
  <rect x="1256" y="478" width="454" height="122" rx="8" fill="#163341" stroke="#3D6373" stroke-width="1.5"/>
  <text x="1276" y="508" font-size="16" font-weight="bold" fill="#FFFFFF">Database: feature store de fraude</text>
  <text x="1276" y="532" font-size="14" fill="#9FB4BE">Hash por entidade + &#237;ndice de busca</text>
  <rect x="1276" y="548" width="414" height="36" rx="6" fill="#0B2027" stroke="#FF4438" stroke-width="1.5"/>
  <text x="1483" y="572" font-size="14" font-weight="bold" fill="#FF8A80" text-anchor="middle">Search Engine: FT.SEARCH &#183; FT.AGGREGATE &#183; h&#237;brido/vetor</text>

  <!-- Central ML cluster -->
  <rect x="1234" y="648" width="498" height="230" rx="10" fill="#0E2833" stroke="#2A4A58" stroke-width="1.5"/>
  <text x="1256" y="682" font-size="19" font-weight="bold" fill="#FFFFFF">Cluster central de ML</text>
  <text x="1256" y="708" font-size="14" fill="#9FB4BE">times menores &#183; 1 database por feature group</text>
  <rect x="1256" y="726" width="220" height="60" rx="8" fill="#163341" stroke="#3D6373" stroke-width="1.5"/>
  <text x="1366" y="750" font-size="14" fill="#FFFFFF" text-anchor="middle">db: cr&#233;dito</text>
  <text x="1366" y="770" font-size="12" fill="#9FB4BE" text-anchor="middle">ACL por escopo</text>
  <rect x="1490" y="726" width="220" height="60" rx="8" fill="#163341" stroke="#3D6373" stroke-width="1.5"/>
  <text x="1600" y="750" font-size="14" fill="#FFFFFF" text-anchor="middle">db: outros feature groups</text>
  <text x="1600" y="770" font-size="12" fill="#9FB4BE" text-anchor="middle">FinOps por database</text>
  <text x="1256" y="822" font-size="14" fill="#9FD9CF">Gradua&#231;&#227;o para cluster dedicado por crit&#233;rios</text>
  <text x="1256" y="844" font-size="14" fill="#9FD9CF">objetivos: criticidade, volume, SLO, isolamento</text>

  <text x="1234" y="928" font-size="14" fill="#9FB4BE">Provisionamento program&#225;tico: API / Terraform,</text>
  <text x="1234" y="950" font-size="14" fill="#9FB4BE">chamado pela plataforma no deploy do feature group</text>
  <text x="1234" y="984" font-size="14" fill="#5B6B75">demo: github.com/gacerioni/redis-feature-materializer</text>

  <!-- ============ FLOWS ============ -->
  <!-- 1: platform -> glue (contract) -->
  <path d="M 500 304 C 540 304, 540 396, 560 410" fill="none" stroke="#091A23" stroke-width="2.5" marker-end="url(#ad)"/>
  <circle cx="530" cy="336" r="15" fill="#091A23"/><text x="530" y="342" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>

  <!-- 2: s3 -> glue -->
  <line x1="500" y1="515" x2="556" y2="515" stroke="#FF4438" stroke-width="3" marker-end="url(#ar)"/>
  <circle cx="528" cy="494" r="15" fill="#FF4438"/><text x="528" y="500" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

  <!-- 2b: glue -> vpce -->
  <line x1="920" y1="560" x2="942" y2="570" stroke="#FF4438" stroke-width="3" marker-end="url(#ar)"/>

  <!-- 3/4: inference -> vpce -->
  <path d="M 500 880 C 760 880, 900 720, 966 674" fill="none" stroke="#2D7FF9" stroke-width="3" marker-end="url(#ab)"/>
  <circle cx="700" cy="856" r="15" fill="#2D7FF9"/><text x="700" y="862" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="736" cy="856" r="15" fill="#7C3AED"/><text x="736" y="862" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>

  <!-- 5: producers -> vpce (dashed) -->
  <path d="M 920 293 C 980 300, 989 420, 989 516" fill="none" stroke="#5B6B75" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ag)"/>
  <circle cx="972" cy="380" r="15" fill="#5B6B75"/><text x="972" y="386" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>

  <!-- ============ LEGEND ============ -->
  <rect x="40" y="1020" width="1720" height="120" rx="12" fill="#F3F5F6" stroke="#C8CFD4" stroke-width="1.5"/>
  <circle cx="80" cy="1052" r="14" fill="#091A23"/><text x="80" y="1057" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="104" y="1058" font-size="15" fill="#091A23">Deploy do feature group: a plataforma entrega o contrato (YAML) ao job, sem c&#243;digo novo por time</text>
  <circle cx="80" cy="1104" r="14" fill="#FF4438"/><text x="80" y="1109" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="104" y="1110" font-size="15" fill="#091A23">Materializa&#231;&#227;o batch: S3 Parquet convertido em snapshot online no Redis, validado a cada execu&#231;&#227;o</text>
  <circle cx="920" cy="1052" r="14" fill="#2D7FF9"/><text x="920" y="1057" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="944" y="1058" font-size="15" fill="#091A23">Serving online: leitura por entidade (HMGET) em sub-milissegundo no servidor</text>
  <circle cx="920" cy="1104" r="14" fill="#7C3AED"/><text x="920" y="1109" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="944" y="1110" font-size="15" fill="#091A23">Feature on-read: FT.AGGREGATE calcula agrega&#231;&#245;es e raz&#245;es na leitura, sem materializa&#231;&#227;o pr&#233;via</text>
  <circle cx="1520" cy="1052" r="14" fill="#5B6B75"/><text x="1520" y="1057" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="1544" y="1058" font-size="15" fill="#091A23">Fase 2: dual-write dos</text>
  <text x="1544" y="1078" font-size="15" fill="#091A23">produtores online (frescor</text>
  <text x="1544" y="1098" font-size="15" fill="#091A23">de segundos, TTL por grupo)</text>
</svg>
